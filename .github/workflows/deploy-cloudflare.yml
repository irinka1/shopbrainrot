name: Deploy Cloudflare Worker

on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "Missing required repository secrets: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID";
            echo "Add them in GitHub → Settings → Secrets and variables → Actions";
            exit 1;
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install wrangler
        run: npm install -g wrangler@2

      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          cd cloudflare-worker
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "account_id = \"$CLOUDFLARE_ACCOUNT_ID\"" >> wrangler.toml; fi
          wrangler publish --api-token "$CLOUDFLARE_API_TOKEN" --json > publish.json
          cat publish.json
          URL=$(jq -r '.url' publish.json)
          echo "Worker URL: $URL"
          cd ..
          # Replace placeholder in app.js
          sed -i "s|https://<your-worker>.workers.dev|${URL}|g" app.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "chore: set Worker ORDER_URL to $URL" || echo "No changes to commit"
          git push

      - name: Output Worker URL
        run: |
          cd cloudflare-worker
          jq -r '.url' publish.json
